<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Urban Outfinders{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <p class="strip">28,000 fashion products · ranked by our own search engine</p>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Urban Outfinders</a>
    {% block header_search %}
    <form class="header-search" action="{{ url_for('search') }}" method="get" role="search">
      <input type="search" name="q" value="{{ found.query if found else '' }}"
             placeholder="Search products" aria-label="Search products" required>
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>
    {% endblock %}
    <nav class="site-nav"><a href="{{ url_for('dashboard') }}">Dashboard</a></nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p class="footer-brand">Urban Outfinders</p>
    <p>Information Retrieval and Web Analytics, 2026. Product data from an Indian fashion e-commerce catalogue.</p>
  </footer>
</body>
</html>
