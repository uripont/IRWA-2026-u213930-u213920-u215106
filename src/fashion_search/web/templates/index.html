{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>Find clothes in 28,000 products</h1>
  <form class="hero-search" action="{{ url_for('search') }}" method="get" role="search">
    <input type="search" name="q" placeholder="e.g. women printed kurta cotton"
           aria-label="Search products" autofocus required>
    <button type="submit">Search</button>
  </form>
</section>

<section class="examples">
  <h2 class="visually-hidden">Popular searches</h2>
  <ul class="tiles">
    {% for example, images in examples %}
    <li>
      <a class="tile" href="{{ url_for('search', q=example) }}">
        {% if images %}<img src="{{ images[0]|image_size(416) }}" alt="" loading="lazy"
             data-images='{{ images|map("image_size", 416)|list|tojson }}'>{% endif %}
        <span>{{ example }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
